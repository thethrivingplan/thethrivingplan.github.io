name: Move start page

on:
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move start page over index
        run: |
          mv start-page.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html start-page.html
          git commit -m "Start page: grid-down findability wording"
          git push
