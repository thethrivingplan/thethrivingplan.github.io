name: move-start
on: workflow_dispatch
jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv start-page.html index.html
          git config user.name "TheThrivingPlan"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Start page: spheres-on-web front door"
          git push
