name: Move table export into place

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move table export into place
        run: |
          mv table/the-infinite-table.html table/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A table/
          git status --short
          git commit -m "Move table export into place"
          git push
