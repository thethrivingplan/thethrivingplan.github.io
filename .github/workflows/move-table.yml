name: move-table
on: workflow_dispatch
jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mv table/the-infinite-table.html table/index.html
          git config user.name "thethrivingplan"
          git config user.email "thethrivingplan@users.noreply.github.com"
          git add -A
          git commit -m "Move table export into place"
          git push
