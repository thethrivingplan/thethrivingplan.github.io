name: Move table file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the-infinite-table.html to index.html
        run: mv table/the-infinite-table.html table/index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add table/index.html table/the-infinite-table.html
          git commit -m "Move table/the-infinite-table.html to table/index.html"
          git push
