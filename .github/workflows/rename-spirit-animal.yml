name: Rename spirit animal file
on: push
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file to spirit-animal.html
        run: |
          if [ ! -f what-s-my-spirit-animal.html ]; then
            echo "no uploaded file to rename"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv -f what-s-my-spirit-animal.html spirit-animal.html
          git add -A
          git commit -m "Rename what-s-my-spirit-animal.html to spirit-animal.html" || exit 0
          git push
