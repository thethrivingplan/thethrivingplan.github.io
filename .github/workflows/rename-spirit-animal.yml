name: Rename spirit animal file
on:
  push:
    paths:
      - '.github/workflows/rename-spirit-animal.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original file as spirit-animal.html
        run: |
          if [ -f spirit-animal.html ] && [ "$(wc -c < spirit-animal.html)" -gt 1000000 ]; then
            echo "spirit-animal.html already has full content, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q spirit-animal.html || true
          git show ab45618486238f1cabf0dd36fb9ec1f4b05a96d3:what-s-my-spirit-animal.html > spirit-animal.html
          git add -A
          git commit -m "Rename what-s-my-spirit-animal.html to spirit-animal.html" || exit 0
          git push
