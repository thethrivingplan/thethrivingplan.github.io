name: Move Scenario Table into place

on:
  push:
    paths:
      - 'scenario/the-scenario-table.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the-scenario-table.html to index.html
        run: |
          mv scenario/the-scenario-table.html scenario/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario/index.html scenario/the-scenario-table.html
          git commit -m "Move the-scenario-table.html to scenario/index.html"
          git push
