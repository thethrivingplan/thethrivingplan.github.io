name: Move scenario table to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move file and commit
        run: |
          mv scenario/the-scenario-table.html scenario/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario/index.html scenario/the-scenario-table.html
          git commit -m "Move updated scenario table to scenario/index.html"
          git push















