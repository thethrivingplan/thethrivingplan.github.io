name: Move Infinite Table into place

on:
  push:
    paths:
      - .github/workflows/move-infinite-table.yml

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded build to index.html
        run: |
          if [ ! -f table/the-infinite-table.html ]; then
            echo "table/the-infinite-table.html not found; nothing to move."
            exit 0
          fi
          mv table/the-infinite-table.html table/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add table/index.html table/the-infinite-table.html
          git commit -m "Infinite Table: launch basics — tap-list claim, one-tap join"
          git push
