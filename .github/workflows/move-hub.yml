name: Move hub to everything

on:
  push:
    paths:
      - .github/workflows/move-hub.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the-hub.html to everything.html
        run: |
          mv the-hub.html everything.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add everything.html the-hub.html
          git commit -m "Move the-hub.html to everything.html" || echo "nothing to commit"
          git push
