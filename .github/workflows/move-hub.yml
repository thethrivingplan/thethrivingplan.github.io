name: Move hub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move hub into place
        run: |
          mv the-hub.html everything.html
          git config user.name "thethrivingplan"
          git config user.email "thethrivingplan@users.noreply.github.com"
          git add everything.html the-hub.html
          git commit -m "Everything hub: Start Page tops Other pages (move into place)"
          git push
