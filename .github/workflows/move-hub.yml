name: Move hub into place
on:
  workflow_dispatch:
jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move the-hub.html to everything.html
        run: |
          mv the-hub.html everything.html
          git config user.name "thethrivingplan"
          git config user.email "thethrivingplan@users.noreply.github.com"
          git add everything.html the-hub.html
          git commit -m "Everything hub: three phone-test fixes (move into place)"
          git push
