name: move-hub
on: workflow_dispatch
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move hub export into place
        run: |
          git config user.name "thethrivingplan"
          git config user.email "thethrivingplan@users.noreply.github.com"
          mv -f the-hub.html everything.html
          git add -A
          git commit -m "Footer move: Everything hub — free line and clock to the footer"
          git push
