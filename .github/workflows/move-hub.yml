name: Move hub onto everything
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the-hub.html onto everything.html
        run: |
          mv the-hub.html everything.html
          git config user.name "thethrivingplan"
          git config user.email "thethrivingplan@users.noreply.github.com"
          git add everything.html the-hub.html
          git commit -m "Refresh everything.html from the-hub.html export"
          git push


















